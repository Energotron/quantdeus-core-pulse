name: Set Telegram Mini App URL Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/set-telegram-miniapp-once.yml'

permissions:
  contents: read

jobs:
  bind:
    if: contains(github.event.head_commit.message, '[bind-telegram-miniapp]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set QuantDeus Store as Telegram menu Web App
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.QUANTDEUS_TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_BOT_TOKEN:-}"
          response=$(curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setChatMenuButton" \
            -H 'Content-Type: application/json' \
            --data '{"menu_button":{"type":"web_app","text":"QuantDeus Store","web_app":{"url":"https://quantdeus.github.io/quantdeus-core-pulse/"}}}')
          echo "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("result") is True; print("Telegram Mini App menu button updated successfully")'

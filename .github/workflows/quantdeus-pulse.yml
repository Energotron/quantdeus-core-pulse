name: QuantDeus Pulse 🌌

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      pillars:
        description: 'Pillars to scan (all or comma-separated)'
        default: 'all'
        required: false

concurrency:
  group: quantdeus-pulse
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          npm install playwright
          npx playwright install chromium
      - name: Run QuantDeus Pulse
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PILLARS: ${{ inputs.pillars || 'all' }}
        run: node scripts/orchestrator.js
      - name: Post report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/report-to-issue.js

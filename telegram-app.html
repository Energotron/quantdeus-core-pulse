<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>QuantDeus Store</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
html,body{margin:0;height:100%;background:#070817;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.sync{position:fixed;z-index:9999;right:10px;top:10px;padding:7px 10px;border-radius:999px;background:rgba(7,8,23,.72);color:#b8ffdc;border:1px solid rgba(133,209,255,.28);font:600 11px system-ui;backdrop-filter:blur(14px);pointer-events:none}.sync.off{color:#ffb8cf}.sync.ok{color:#b8ffdc}
</style>
</head>
<body>
<div id="sync" class="sync">SYNC…</div>
<iframe id="store" src="/" allow="clipboard-write"></iframe>
<script>
const MAKE='https://hook.eu2.make.com/f1m8rn9hwondi1ngl6tdurxfmxmr2muy';
const tg=window.Telegram&&window.Telegram.WebApp;
const pill=document.getElementById('sync');
if(tg){try{tg.ready();tg.expand()}catch(e){}}
async function emit(event,extra={}){
  const payload={action:'store.sync',event,source:'quantdeus.github.io',telegram:!!(tg&&tg.initData),ts:Date.now(),...extra};
  try{
    const r=await fetch(MAKE,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
    pill.textContent='SYNC ✓';pill.className='sync ok';
    return r.ok;
  }catch(e){
    try{await fetch(MAKE,{method:'POST',mode:'no-cors',headers:{'content-type':'text/plain'},body:JSON.stringify(payload)});pill.textContent='SYNC →';pill.className='sync ok';return true}catch(_){pill.textContent='SYNC OFF';pill.className='sync off';return false}
  }
}
const frame=document.getElementById('store');
frame.addEventListener('load',()=>{
  emit('miniapp.open');
  try{
    const d=frame.contentDocument;
    d.addEventListener('click',e=>{
      const t=e.target.closest('button,.chip,.card'); if(!t)return;
      let event='ui.click';
      if(t.id==='randomBtn')event='cinema.random';
      else if(t.id==='favNav')event='favorites.open';
      else if(t.id==='vibeNav')event='vibes.open';
      else if(t.id==='profileNav')event='profile.open';
      else if(t.classList.contains('fav'))event='favorite.toggle';
      const favs=JSON.parse(localStorage.getItem('quantdeus-favorites')||'[]');
      emit(event,{favorites_count:Array.isArray(favs)?favs.length:0});
    },true);
  }catch(e){}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')emit('miniapp.resume')});
</script>
</body>
</html>
